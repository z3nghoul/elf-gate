[tun]
caps_warning = "Правила за процесами: у ядра є лише {have}. Без cap_sys_ptrace і cap_dac_read_search Xray не бачить, якій програмі належить з'єднання, якщо це програма іншого користувача або програма в пісочниці (Chromium, Electron, Discord із Flatpak, системні служби). Такі з'єднання підуть за правилом за замовчуванням, а в журналі будуть помилки «no process found».\n\nЩоб правила працювали для всіх програм (виконайте самі; право читати чужі файли та сокети надається лише root-копії ядра, яку ніхто, крім root, не може змінити):\n  sudo setcap {caps} {dir}/xray\nабо запустіть  ./elf-gate-tun.sh (він надає ці права сам; ELF_GATE_FULL_CAPS=0 залишає лише cap_net_admin)"
