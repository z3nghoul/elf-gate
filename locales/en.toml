[tun]
caps_warning = "Process rules: the core has only {have}. Without cap_sys_ptrace and cap_dac_read_search Xray cannot see which program owns a connection if it is another user's program or a sandboxed one (Chromium, Electron, Discord from Flatpak, system services). Such connections follow the default rule, and the log shows \"no process found\" errors.\n\nTo make the rules work for all programs (run this yourself; the right to read other users' files and sockets is given only to a root-owned copy of the core that nobody but root can modify):\n  sudo setcap {caps} {dir}/xray\nor run  ./elf-gate-tun.sh (it grants these rights itself; ELF_GATE_FULL_CAPS=0 keeps only cap_net_admin)"
core_missing = "TUN mode needs a root-owned copy of Xray: {path} not found.\n\nInstall it (run this yourself, elf-gate does not call sudo):\n  {cmds}\n\nFallback: run  sudo elf-gate  (the config stays in your home folder)."
core_missing_win = "xray.exe for TUN mode not found: {path}. Put it next to elf-gate.exe."
dns_error = "could not resolve {address}: {error}"
dns_timeout = "could not resolve {address}: DNS timeout"
geodata_missing = "The core for TUN mode has no geoip.dat and/or geosite.dat next to it: {dir}.\nThe core copy looks for them only next to itself.\n\nInstall (run this yourself, elf-gate does not call sudo):\n  {cmds}"
needs_admin = "TUN mode needs administrator rights. Restart elf-gate as administrator?"
needs_caps = "Xray has no right to create a TUN interface.\n\nRun once:\n  sudo setcap {caps} {dir}/xray\nor run  sudo elf-gate  (the config stays in your home folder)."
no_addresses = "no addresses for {address}"
no_device = "There is no /dev/net/tun. Load the module: sudo modprobe tun (or enable TUN support in the kernel/container)."
path_to = "/path/to"
path_to_xray = "/path/to/xray"
rp_filter = "Warning: strict rp_filter (1) is on for the interface {iface}. \"Direct\" traffic through TUN may hang.\nCheck and, if needed, run this yourself:\n  sudo sysctl -w net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.{iface}.rp_filter=2\nelf-gate does not change these settings."
blocked_locally = "Windows blocked elf-gate from connecting to {addr} - check the firewall, antivirus and other VPN programs (ExitLag etc.)"
