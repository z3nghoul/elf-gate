[explain]
api_port = "The core's internal port for traffic statistics. Change only if it is taken. Applies at the next connection."
auto_connect = "Connect to the last server as soon as the program starts. Off by default."
autostart_unix = "Start elf-gate automatically when you log in, so you do not have to start it by hand. In TUN mode the network interface needs permissions (see elf-gate-tun.sh)."
autostart_win = "Start elf-gate automatically when you log in, so you do not have to start it by hand. In TUN mode Windows asks for administrator rights once, then does not ask again."
check_updates = "Once a day, check whether a new elf-gate version is out. Nothing is downloaded: you only see a notice."
firewall = "Let elf-gate work in the Windows Firewall. Helps if you get the error \"Windows blocked elf-gate from connecting\". Windows will ask you to confirm once."
http_port = "The port where elf-gate accepts HTTP traffic. Change only if another program uses it. Applies at the next connection."
hwid = "This device's identifier for subscription providers; it stays the same between runs. No need to change it. Enter shows details."
language = "Interface language. Changes at once and does not affect the VPN."
log_level = "How detailed the Xray core's log is. Choose debug when looking for a problem. Applies at the next connection."
ping_auto = "How often to check all servers again in the background. 0 turns it off. Default: 60 s."
ping_mode = "How to check servers. url opens a test page through the server: you can see that the server works. tcp only checks the port: faster, but does not guarantee the VPN works. Default: url."
ping_timeout = "How long to wait for the server's answer when checking. A server that does not answer in time counts as unreachable. Default: 3000 ms (3 s)."
ping_url = "The address opened by a url ping. Any fast site will do. Default: www.gstatic.com/generate_204."
privacy = "Hides addresses, keys and links on the screen, handy for screenshots and screen sharing. Files and settings are not changed."
proxy_with_tun = "Keep the system proxy on in TUN mode too, so programs that read it also go through the VPN. On by default."
socks_port = "The port where elf-gate accepts SOCKS traffic. Change only if another program uses it. Applies at the next connection."
sub_default_hours = "How often to update subscriptions by themselves, in hours. 0 means never. A subscription can set its own value. Default: 12."
sub_default_hwid = "Send the provider this device's identifier (HWID). Some panels give no list without it. A subscription can set its own."
sub_default_ua = "How elf-gate introduces itself to the subscription server; some providers answer differently. A subscription can set its own value."
sub_delete = "Delete the subscription and all its servers from the list. You will be asked first. Enter starts it."
sub_hidden = "Servers you removed from the list. Enter shows them in the list so you can bring them back."
sub_hours = "How often to update this subscription, in hours. 0 means never. Enter edits, r returns the common value from the settings."
sub_hwid = "Whether to send this subscription the device identifier. Enter switches, r returns the common value from the settings."
sub_name = "The subscription's name as the provider gave it. It cannot be changed here."
sub_update = "Download this subscription's server list right now. Enter runs it."
sub_url = "Where the server list is. The link holds a secret key, so it is not shown in full."
sub_user_agent = "How elf-gate introduces itself to this subscription's server. Enter edits, r returns the common value from the settings."
system_proxy = "Send the system's programs through elf-gate automatically (system proxy). Turn off if you set the proxy in your programs yourself."
theme = "Interface colours: mocha is dark, latte is light, terminal uses your terminal's own colours. Default: mocha."
transparent_bg = "Do not paint the screen with the theme colour; keep the terminal background. Works if the terminal background is the same tone as the theme."
tun_name = "Name of the virtual network interface of TUN mode. Change it only if it clashes with another one. Default: elfgate0."
tun_xray_path = "Linux only: which Xray to run for TUN mode. It has special permissions, so it is a separate copy. Usually no need to change."
tunnel_dns = "DNS server inside the tunnel: name lookups go through it so they do not leak past the VPN. Default: 1.1.1.1."
update_channel = "Which versions to show: stable ones are tested, test ones are newer but may have bugs."
verbose_log = "Write every connection to the log (access). Helps find problems, but the log grows fast. Off by default."
xray_path = "Where Xray is, the core that carries the traffic. Change only if it is installed in an unusual place. Applies at the next connection."

