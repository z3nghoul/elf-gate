[tun]
caps_warning = "Правила по процессам: у ядра есть только {have}. Без cap_sys_ptrace и cap_dac_read_search Xray не видит, какой программе принадлежит соединение, если это программа другого пользователя или программа в песочнице (Chromium, Electron, Discord из Flatpak, системные службы). Такие соединения пойдут по правилу по умолчанию, а в журнале будут ошибки «no process found».\n\nЧтобы правила работали для всех программ (выполните сами; право читать чужие файлы и сокеты даётся только root-копии ядра, которую никто кроме root изменить не может):\n  sudo setcap {caps} {dir}/xray\nили запустите  ./elf-gate-tun.sh (он выдаёт эти права сам; ELF_GATE_FULL_CAPS=0 оставляет только cap_net_admin)"
core_missing = "Для режима TUN нужна копия Xray, принадлежащая root: {path} не найден.\n\nУстановка (выполните сами, elf-gate sudo не вызывает):\n  {cmds}\n\nЗапасной путь: запустить  sudo elf-gate  (конфиг останется в вашей домашней папке)."
