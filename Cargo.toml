[package]
name = "elf-gate"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }

[target."cfg(unix)".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
nix = { version = "0.31.3", features = ["process", "signal", "user", "fs"] }
ksni = "0.3.7"

[target."cfg(windows)".dependencies]
# SChannel instead of rustls: no C toolchain is needed to cross-check the Windows build from Linux,
# and the system certificate store is used (see docs/decisions.md).
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "socks"] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.release]
strip = true
