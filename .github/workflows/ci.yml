name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, to check a branch before it reaches main.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One place for the Xray version and hashes, shared with windows-test.yml.
      - name: Load the pinned Xray version
        shell: bash
        run: cat .github/xray.env >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The runner image goes into the key: a cache built on another image (ubuntu-latest
          # vs ubuntu-22.04) failed to link aws-lc-sys (__isoc23_sscanf).
          key: ${{ matrix.os }}
      # Real Xray for the integration tests (Linux only for now). The pinned hash
      # makes a changed or tampered download fail the build instead of being trusted.
      - name: Install Xray (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_LINUX_SHA256}  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          mkdir -p bin
          unzip -q -o "$RUNNER_TEMP/xray.zip" xray geoip.dat geosite.dat -d bin
          chmod +x bin/xray
          bin/xray version | head -1
      # The Windows archive is verified and unpacked into bin/, where the integration tests look.
      - name: Install Xray (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'xray-win.zip'
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $env:XRAY_WIN_SHA256) {
            throw "Xray archive SHA256 mismatch. expected $env:XRAY_WIN_SHA256, got $actual"
          }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Expand-Archive -Path $zip -DestinationPath bin -Force
          .\bin\xray.exe version | Select-Object -First 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # With Xray installed the integration tests must really run, not print SKIPPED.
      - name: Xray integration tests (must not be skipped)
        shell: bash
        run: |
          cargo test xray::integration_tests -- --nocapture 2>&1 | tee xray-tests.log
          if grep -q SKIPPED xray-tests.log; then echo "Xray tests were skipped"; exit 1; fi
      - run: cargo build --release
        env:
          ELF_GATE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elf-gate-${{ matrix.os }}
          path: |
            target/release/elf-gate
            target/release/elf-gate.exe
            target/release/elf-gated
            target/release/elf-gated.exe
            packaging/scripts/elf-gate-tun.sh
            packaging/scripts/elf-gate-tun.bat
          if-no-files-found: error
