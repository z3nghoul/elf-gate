name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  XRAY_VERSION: v26.11.9

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Real Xray for the integration tests (Linux only for now). The pinned hash
      # makes a changed or tampered download fail the build instead of being trusted.
      - name: Install Xray (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          XRAY_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          mkdir -p bin
          unzip -q -o "$RUNNER_TEMP/xray.zip" xray geoip.dat geosite.dat -d bin
          chmod +x bin/xray
          bin/xray version | head -1
      # The Windows archive is only checksummed (no unpacking, no running): it pins the
      # release we develop against until the Windows job gets its own Xray tests.
      - name: Verify Xray Windows archive checksum
        if: runner.os == 'Linux'
        shell: bash
        env:
          XRAY_WIN_SHA256: 1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xray-win.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-windows-64.zip"
          echo "${XRAY_WIN_SHA256}  $RUNNER_TEMP/xray-win.zip" | sha256sum -c -
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # With Xray installed the integration tests must really run, not print SKIPPED.
      - name: Xray integration tests (must not be skipped)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test xray::integration_tests -- --nocapture 2>&1 | tee xray-tests.log
          if grep -q SKIPPED xray-tests.log; then echo "Xray tests were skipped"; exit 1; fi
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: elf-gate-${{ matrix.os }}
          path: |
            target/release/elf-gate
            target/release/elf-gate.exe
          if-no-files-found: error
